# 5GInvest - Nginx reverse proxy
# A AJOUTER dans /etc/nginx/sites-available/ puis symlink dans sites-enabled
# NE REMPLACE PAS la config existante de l'autre app
#
# Usage:
#   sudo cp deploy/nginx-5ginvest.conf /etc/nginx/sites-available/5ginvest
#   sudo ln -s /etc/nginx/sites-available/5ginvest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name invest.VOTRE_DOMAINE.fr;  # ← MODIFIER avec votre domaine/sous-domaine

    # Redirection HTTPS (si certbot configuré)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache des assets statiques
    location /static/ {
        proxy_pass http://127.0.0.1:8042/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker (ne pas cacher)
    location = /sw.js {
        proxy_pass http://127.0.0.1:8042/sw.js;
        add_header Cache-Control "no-cache";
    }

    # Manifest
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8042/manifest.json;
        add_header Cache-Control "no-cache";
    }
}

