# Portfolio Dashboard - Nginx reverse proxy
# Usage sur le VPS:
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/dashboard
#   sudo ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.5ginvest.fr

server {
    listen 80;
    server_name dashboard.5ginvest.fr;

    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5051/api/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
